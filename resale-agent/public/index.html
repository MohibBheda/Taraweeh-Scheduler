<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resale Agent</title>
<style>
:root {
  --bg:       #0d1117;
  --surface:  #161b22;
  --surface2: #21262d;
  --border:   #30363d;
  --text:     #e6edf3;
  --muted:    #8b949e;
  --green:    #3fb950;
  --red:      #f85149;
  --yellow:   #d29922;
  --blue:     #58a6ff;
  --purple:   #bc8cff;
  --r:        8px;
  --font:     -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:     'SF Mono', 'Cascadia Code', 'Fira Mono', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(13,17,23,0.9);
  backdrop-filter: blur(8px);
  z-index: 100;
}

.logo {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.5px;
}
.logo em { color: var(--green); font-style: normal; }

/* ── Nav ── */
nav {
  display: flex;
  gap: 2px;
}

nav button {
  background: none;
  border: none;
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 500;
  padding: 7px 14px;
  transition: background 0.15s, color 0.15s;
}
nav button:hover { background: var(--surface2); color: var(--text); }
nav button.active { background: var(--surface2); color: var(--text); }

/* ── Layout ── */
main {
  max-width: 860px;
  margin: 0 auto;
  padding: 36px 24px 80px;
}

.tab { display: none; }
.tab.active { display: block; }

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 24px;
}

/* ── Form ── */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.field { display: flex; flex-direction: column; gap: 5px; }
.field.span2 { grid-column: 1 / -1; }

label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

input, select, textarea {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  outline: none;
  padding: 9px 12px;
  transition: border-color 0.15s;
  width: 100%;
}
input:focus, select:focus { border-color: var(--blue); }
input::placeholder { color: var(--muted); }

.prefix-wrap { position: relative; }
.prefix-wrap .prefix {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.prefix-wrap input { padding-left: 22px; }

.helper { color: var(--muted); font-size: 11px; margin-top: 2px; }

/* ── Buttons ── */
.btn {
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 600;
  padding: 9px 18px;
  transition: opacity 0.15s, transform 0.1s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.85; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

.btn-primary { background: var(--green); color: #000; width: 100%; padding: 12px; font-size: 14px; margin-top: 6px; }
.btn-ghost { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
.btn-sm { font-size: 12px; padding: 5px 12px; }

/* ── Decision badge ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.4px;
}
.badge-BUY         { background: rgba(63,185,80,0.12);  color: var(--green);  border: 1px solid rgba(63,185,80,0.3); }
.badge-REJECT      { background: rgba(248,81,73,0.12);  color: var(--red);    border: 1px solid rgba(248,81,73,0.3); }
.badge-CONSIDER    { background: rgba(210,153,34,0.12); color: var(--yellow); border: 1px solid rgba(210,153,34,0.3); }
.badge-INVESTIGATE, .badge-INSUFFICIENT_DATA {
                     background: rgba(139,148,158,0.12); color: var(--muted);  border: 1px solid var(--border); }

/* ── Metrics row ── */
.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 20px 0;
}

.metric {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px 12px;
  text-align: center;
}
.metric-val {
  font-family: var(--mono);
  font-size: 26px;
  font-weight: 700;
  line-height: 1.1;
}
.metric-lbl {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-top: 4px;
}

.pos { color: var(--green); }
.neg { color: var(--red); }

/* ── Risk bar ── */
.risk-track {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.risk-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.5s ease;
}

/* ── Breakdown table ── */
.breakdown { margin-top: 20px; }
.breakdown-title {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 10px;
}
.brow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.brow:last-child { border-bottom: none; font-weight: 600; }
.brow .bl { color: var(--muted); }
.brow .bv { font-family: var(--mono); }

/* ── Confidence chip ── */
.chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.chip-high   { background: rgba(63,185,80,0.12);  color: var(--green); }
.chip-medium { background: rgba(210,153,34,0.12); color: var(--yellow); }
.chip-low    { background: rgba(248,81,73,0.12);  color: var(--red); }
.chip-none   { background: rgba(139,148,158,0.1); color: var(--muted); }

/* ── Warning box ── */
.warn {
  background: rgba(248,81,73,0.07);
  border: 1px solid rgba(248,81,73,0.2);
  border-radius: 6px;
  color: var(--red);
  font-size: 12px;
  margin-bottom: 16px;
  padding: 10px 14px;
}

/* ── Stats ── */
.stats {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}
.stat {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 14px 10px;
  text-align: center;
}
.stat-n {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
}
.stat-l {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  margin-top: 3px;
}

/* ── Filter pills ── */
.filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.fpill {
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--muted);
  cursor: pointer;
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  padding: 5px 14px;
  transition: all 0.15s;
}
.fpill:hover { border-color: var(--text); color: var(--text); }
.fpill.on { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }

/* ── Table ── */
.tbl-wrap {
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow-x: auto;
}
table { border-collapse: collapse; width: 100%; }
th {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.6px;
  padding: 10px 14px;
  text-align: left;
  text-transform: uppercase;
  white-space: nowrap;
}
td {
  border-top: 1px solid var(--border);
  font-size: 13px;
  padding: 11px 14px;
  white-space: nowrap;
}
tr:hover td { background: rgba(255,255,255,0.02); }

.status {
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 9px;
}
.s-candidate { background: rgba(88,166,255,0.1);  color: var(--blue); }
.s-bought    { background: rgba(188,140,255,0.1); color: var(--purple); }
.s-listed    { background: rgba(210,153,34,0.1);  color: var(--yellow); }
.s-sold      { background: rgba(63,185,80,0.1);   color: var(--green); }
.s-rejected  { background: rgba(248,81,73,0.1);   color: var(--red); }

/* ── Listing output ── */
.lsection { margin-bottom: 20px; }
.lhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.llabel {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.lbox {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  padding: 14px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ── Price trio ── */
.price-trio {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

/* ── Toast ── */
#toast {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  bottom: 28px;
  font-size: 13px;
  opacity: 0;
  padding: 10px 18px;
  pointer-events: none;
  position: fixed;
  right: 28px;
  transform: translateY(6px);
  transition: all 0.2s;
  z-index: 999;
}
#toast.show { opacity: 1; transform: translateY(0); }

/* ── Spinner ── */
.spin {
  animation: spin 0.7s linear infinite;
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: 50%;
  border-top-color: var(--green);
  display: inline-block;
  height: 14px;
  vertical-align: middle;
  width: 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Empty state ── */
.empty { color: var(--muted); padding: 52px; text-align: center; }

/* ── Divider ── */
.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* ── Responsive ── */
@media (max-width: 640px) {
  .grid    { grid-template-columns: 1fr; }
  .metrics { grid-template-columns: 1fr 1fr; }
  .stats   { grid-template-columns: repeat(3, 1fr); }
  .price-trio { grid-template-columns: 1fr; }
  header   { padding: 12px 16px; }
  main     { padding: 24px 16px 60px; }
}
</style>
</head>
<body>

<header>
  <div class="logo">resale<em>agent</em></div>
  <nav>
    <button class="active" data-tab="evaluate" onclick="switchTab(this)">Evaluate</button>
    <button data-tab="inventory" onclick="switchTab(this)">Inventory</button>
    <button data-tab="listing" onclick="switchTab(this)">Listing</button>
  </nav>
</header>

<main>

  <!-- ══════════════════════ EVALUATE ══════════════════════ -->
  <div id="tab-evaluate" class="tab active">
    <div class="card">
      <div class="grid">

        <div class="field span2">
          <label>Item Title</label>
          <input id="ev-title" type="text" placeholder="e.g. DeWalt 20V MAX Cordless Drill DCD771C2" />
        </div>

        <div class="field">
          <label>Your Buy Price</label>
          <div class="prefix-wrap">
            <span class="prefix">$</span>
            <input id="ev-price" type="number" placeholder="30.00" min="0" step="0.01" />
          </div>
        </div>

        <div class="field">
          <label>Category</label>
          <select id="ev-cat">
            <option value="">Select…</option>
            <option value="smartphones">Smartphones</option>
            <option value="laptops">Laptops</option>
            <option value="electronics">Electronics</option>
            <option value="gaming">Gaming</option>
            <option value="tools">Tools</option>
            <option value="clothing">Clothing</option>
            <option value="collectibles">Collectibles</option>
            <option value="jewelry">Jewelry</option>
            <option value="books">Books</option>
            <option value="furniture">Furniture</option>
            <option value="appliances">Appliances</option>
            <option value="sporting">Sporting Goods</option>
          </select>
        </div>

        <div class="field">
          <label>Condition</label>
          <select id="ev-cond">
            <option value="good">Good</option>
            <option value="excellent">Excellent</option>
            <option value="like_new">Like New / Open Box</option>
            <option value="new">New</option>
            <option value="fair">Fair</option>
            <option value="parts">For Parts</option>
          </select>
        </div>

        <div class="field">
          <label>Weight</label>
          <select id="ev-weight">
            <option value="light">Light — under 1 lb</option>
            <option value="medium" selected>Medium — 1 to 5 lbs</option>
            <option value="heavy">Heavy — 5 to 20 lbs</option>
            <option value="freight">Freight — 20+ lbs</option>
          </select>
        </div>

        <div class="field span2">
          <label>eBay Sold Prices</label>
          <input id="ev-comps" type="text" placeholder="85, 90, 78, 92, 88" />
          <div class="helper">Search on eBay → tick "Sold Listings" → paste the prices here, comma-separated. More = better accuracy.</div>
        </div>

        <div class="field span2">
          <label>Notes (optional)</label>
          <input id="ev-notes" type="text" placeholder="Missing charger, small crack, scratched screen…" />
        </div>

      </div>
      <button class="btn btn-primary" id="ev-btn" onclick="doEvaluate()">Evaluate Item</button>
    </div>

    <div id="ev-result" style="margin-top:20px; display:none;"></div>
  </div>

  <!-- ══════════════════════ INVENTORY ══════════════════════ -->
  <div id="tab-inventory" class="tab">
    <div id="inv-stats" class="stats"></div>
    <div class="filters" id="inv-filters">
      <button class="fpill on" onclick="filterInv('all',this)">All</button>
      <button class="fpill" onclick="filterInv('candidate',this)">Candidates</button>
      <button class="fpill" onclick="filterInv('bought',this)">Bought</button>
      <button class="fpill" onclick="filterInv('listed',this)">Listed</button>
      <button class="fpill" onclick="filterInv('sold',this)">Sold</button>
    </div>
    <div id="inv-table"></div>
  </div>

  <!-- ══════════════════════ LISTING ══════════════════════ -->
  <div id="tab-listing" class="tab">
    <div class="card" style="margin-bottom:20px;">
      <div class="grid">

        <div class="field span2">
          <label>Item Title</label>
          <input id="li-title" type="text" placeholder="e.g. Milwaukee M18 Impact Driver 2653-20" />
        </div>

        <div class="field">
          <label>Condition</label>
          <select id="li-cond">
            <option value="good">Good</option>
            <option value="excellent">Excellent</option>
            <option value="like_new">Like New / Open Box</option>
            <option value="new">New</option>
            <option value="fair">Fair</option>
            <option value="parts">For Parts</option>
          </select>
        </div>

        <div class="field">
          <label>Category</label>
          <select id="li-cat">
            <option value="">Select…</option>
            <option value="smartphones">Smartphones</option>
            <option value="electronics">Electronics</option>
            <option value="gaming">Gaming</option>
            <option value="tools">Tools</option>
            <option value="clothing">Clothing</option>
            <option value="collectibles">Collectibles</option>
            <option value="appliances">Appliances</option>
            <option value="sporting">Sporting Goods</option>
          </select>
        </div>

        <div class="field">
          <label>Estimated Resale Price</label>
          <div class="prefix-wrap">
            <span class="prefix">$</span>
            <input id="li-price" type="number" placeholder="87.00" min="0" step="0.01" />
          </div>
        </div>

        <div class="field">
          <label>Weight</label>
          <select id="li-weight">
            <option value="light">Light — under 1 lb</option>
            <option value="medium" selected>Medium — 1 to 5 lbs</option>
            <option value="heavy">Heavy — 5 to 20 lbs</option>
            <option value="freight">Freight — 20+ lbs</option>
          </select>
        </div>

        <div class="field span2">
          <label>Notes (optional)</label>
          <input id="li-notes" type="text" placeholder="Missing charger, scratch on back…" />
        </div>

      </div>
      <button class="btn btn-primary" id="li-btn" onclick="doListing()">Generate Listing</button>
    </div>

    <div id="li-output" style="display:none;"></div>
  </div>

</main>

<div id="toast"></div>

<script>
// ─── State ─────────────────────────────────────────────────
let _lastResult  = null;
let _allItems    = [];
let _invFilter   = 'all';

// ─── Tabs ──────────────────────────────────────────────────
function switchTab(btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
  btn.classList.add('active');
  if (btn.dataset.tab === 'inventory') loadInventory();
}

// ─── Toast ─────────────────────────────────────────────────
function toast(msg, ms = 2400) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), ms);
}

// ─── Clipboard ─────────────────────────────────────────────
function cp(text, lbl) {
  navigator.clipboard.writeText(text).then(() => toast(`${lbl} copied ✓`));
}

// ─── Loading state ─────────────────────────────────────────
function setBusy(btnId, busy) {
  const b = document.getElementById(btnId);
  if (busy) { b._label = b.textContent; b.disabled = true; b.innerHTML = '<span class="spin"></span>'; }
  else       { b.disabled = false; b.textContent = b._label; }
}

// ─── ─── ─── EVALUATE ─── ─── ───────────────────────────────

async function doEvaluate() {
  const title = document.getElementById('ev-title').value.trim();
  const price = parseFloat(document.getElementById('ev-price').value);
  if (!title) { toast('Enter an item title first'); return; }
  if (!(price > 0)) { toast('Enter a valid buy price'); return; }

  const compsRaw = document.getElementById('ev-comps').value;
  const comps    = compsRaw.split(',').map(s => parseFloat(s.trim())).filter(n => n > 0 && isFinite(n));

  const body = {
    title,
    purchase_price: price,
    condition:   document.getElementById('ev-cond').value,
    weight_class: document.getElementById('ev-weight').value,
    category: document.getElementById('ev-cat').value   || undefined,
    notes:    document.getElementById('ev-notes').value.trim() || undefined,
  };
  if (comps.length) body.comparable_sales = comps;

  setBusy('ev-btn', true);
  try {
    const res  = await fetch('/evaluate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    _lastResult = data;
    renderResult(data);
  } catch(e) {
    toast('Error: ' + e.message);
  } finally {
    setBusy('ev-btn', false);
  }
}

function renderResult(d) {
  const el = document.getElementById('ev-result');
  el.style.display = 'block';

  if (d.decision.action === 'INSUFFICIENT_DATA') {
    el.innerHTML = `
      <div class="card">
        <span class="badge badge-INSUFFICIENT_DATA">⚠ No Data</span>
        <p style="margin-top:14px; color:var(--muted);">${d.decision.reason}</p>
      </div>`;
    return;
  }

  const profit = d.net_profit;
  const roi    = d.roi_percentage;
  const risk   = d.risk_score;
  const action = d.decision.action;

  const pClass = profit >= 0 ? 'pos' : 'neg';
  const rClass = roi    >= 0 ? 'pos' : 'neg';

  const riskColor = risk <= 3 ? 'var(--green)' : risk <= 6 ? 'var(--yellow)' : 'var(--red)';
  const cb  = d.cost_breakdown;
  const dq  = d.data_quality;
  const md  = d.market_data;

  const icon = { BUY:'✓ BUY', REJECT:'✕ REJECT', CONSIDER:'~ CONSIDER', INVESTIGATE:'? INVESTIGATE' }[action] || action;

  const dataWarn = dq.data_label
    ? `<div class="warn">⚠ ${dq.data_label} — Verify real eBay sold prices before buying.</div>`
    : '';

  el.innerHTML = `
    <div class="card">
      ${dataWarn}
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <span class="badge badge-${action}">${icon}</span>
        <div style="display:flex; align-items:center; gap:8px;">
          <span class="chip chip-${dq.confidence || 'none'}">${dq.confidence || 'no data'} confidence</span>
          ${md.sample_size > 0 ? `<span style="font-size:11px;color:var(--muted)">${md.sample_size} sold comps</span>` : ''}
        </div>
      </div>
      <p style="font-size:13px; color:var(--muted); margin-top:10px;">${d.decision.reason}</p>

      <div class="metrics">
        <div class="metric">
          <div class="metric-val ${pClass}">$${profit.toFixed(2)}</div>
          <div class="metric-lbl">Net Profit</div>
        </div>
        <div class="metric">
          <div class="metric-val ${rClass}">${roi}%</div>
          <div class="metric-lbl">ROI</div>
        </div>
        <div class="metric">
          <div class="metric-val" style="color:${riskColor}">${risk}<span style="font-size:16px;">/10</span></div>
          <div class="metric-lbl">Risk</div>
          <div class="risk-track"><div class="risk-fill" style="width:${risk*10}%; background:${riskColor};"></div></div>
        </div>
      </div>

      <div class="breakdown">
        <div class="breakdown-title">Cost Breakdown</div>
        <div class="brow"><span class="bl">Estimated resale</span><span class="bv">$${d.resale_price_estimate.toFixed(2)}</span></div>
        <div class="brow"><span class="bl">Your buy price</span><span class="bv neg">−$${cb.purchase_price.toFixed(2)}</span></div>
        <div class="brow"><span class="bl">eBay fees (13.25%)</span><span class="bv neg">−$${cb.ebay_fees.toFixed(2)}</span></div>
        <div class="brow"><span class="bl">Shipping estimate</span><span class="bv neg">−$${cb.shipping_estimate.toFixed(2)}</span></div>
        <div class="brow"><span class="bl">Safety buffer (12%)</span><span class="bv neg">−$${cb.safety_buffer.toFixed(2)}</span></div>
        <div class="brow"><span>Net profit</span><span class="bv ${pClass}">$${profit.toFixed(2)}</span></div>
      </div>

      ${md.sold_range_low != null ? `
        <p style="font-size:12px; color:var(--muted); margin-top:14px;">
          Sold range: <span style="color:var(--text); font-family:var(--mono);">$${md.sold_range_low} – $${md.sold_range_high}</span>
          &nbsp;·&nbsp; Avg: <span style="color:var(--text); font-family:var(--mono);">$${md.avg_sold_price.toFixed(2)}</span>
        </p>` : ''}

      <hr class="divider">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="prefillListing()">Generate Listing →</button>
        ${d.id ? `<button class="btn btn-ghost btn-sm" onclick="setStatus(${d.id},'bought')">Mark as Bought</button>` : ''}
      </div>
    </div>`;

  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ─── ─── ─── INVENTORY ─── ─── ──────────────────────────────

async function loadInventory() {
  try {
    const res  = await fetch('/inventory');
    const data = await res.json();
    _allItems = data.items || [];
    renderStats(data.stats || {});
    renderTable(_invFilter);
  } catch(e) {
    toast('Could not load inventory');
  }
}

function renderStats(s) {
  const profit = s.total_realized_profit || 0;
  const pClass = profit >= 0 ? 'pos' : 'neg';
  document.getElementById('inv-stats').innerHTML = `
    <div class="stat"><div class="stat-n">${s.total||0}</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--blue)">${s.candidates||0}</div><div class="stat-l">Candidates</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--purple)">${s.bought||0}</div><div class="stat-l">Bought</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--yellow)">${s.listed||0}</div><div class="stat-l">Listed</div></div>
    <div class="stat"><div class="stat-n" style="color:var(--green)">${s.sold||0}</div><div class="stat-l">Sold</div></div>
    <div class="stat"><div class="stat-n ${pClass}">$${profit.toFixed(0)}</div><div class="stat-l">Realized</div></div>`;
}

function filterInv(status, btn) {
  _invFilter = status;
  document.querySelectorAll('.fpill').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  renderTable(status);
}

function renderTable(filter) {
  const items = filter === 'all' ? _allItems : _allItems.filter(i => i.status === filter);
  const wrap  = document.getElementById('inv-table');

  if (!items.length) {
    wrap.innerHTML = `<div class="empty">Nothing here yet.</div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Buy</th>
          <th>Resale Est.</th>
          <th>Net Profit</th>
          <th>ROI</th>
          <th>Risk</th>
          <th>Status</th>
          <th>Move to</th>
        </tr>
      </thead>
      <tbody>
        ${items.map(item => {
          const pc = (item.roi_percentage||0) >= 0 ? 'pos' : 'neg';
          return `<tr>
            <td style="max-width:220px; overflow:hidden; text-overflow:ellipsis;" title="${esc(item.title)}">${esc(item.title)}</td>
            <td style="font-family:var(--mono)">$${item.purchase_price.toFixed(2)}</td>
            <td style="font-family:var(--mono)">${item.estimated_resale_price != null ? '$'+item.estimated_resale_price.toFixed(2) : '—'}</td>
            <td style="font-family:var(--mono)" class="${pc}">${item.net_profit != null ? (item.net_profit>=0?'+':'')+' $'+item.net_profit.toFixed(2) : '—'}</td>
            <td style="font-family:var(--mono)" class="${pc}">${item.roi_percentage != null ? item.roi_percentage+'%' : '—'}</td>
            <td style="font-family:var(--mono)">${item.risk_score != null ? item.risk_score+'/10' : '—'}</td>
            <td><span class="status s-${item.status}">${item.status}</span></td>
            <td>
              <select onchange="changeStatus(${item.id}, this)" style="background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:12px;padding:4px 8px;">
                <option value="">—</option>
                <option value="candidate">candidate</option>
                <option value="bought">bought</option>
                <option value="listed">listed</option>
                <option value="sold">sold</option>
                <option value="rejected">rejected</option>
              </select>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
    </div>`;
}

async function changeStatus(id, sel) {
  const status = sel.value;
  if (!status) return;
  sel.value = '';

  if (status === 'sold') {
    const raw = prompt('Actual sale price? (leave blank to skip recalculation)');
    if (raw !== null && raw.trim() !== '') {
      await apiFetch('/mark-sold', { id, actual_sale_price: parseFloat(raw) });
      toast('Marked as sold ✓');
      loadInventory();
      return;
    }
  }

  await setStatus(id, status);
  loadInventory();
}

async function setStatus(id, status) {
  await apiFetch('/update-status', { id, status });
  toast(`Status → ${status}`);
}

// ─── ─── ─── LISTING ─── ─── ────────────────────────────────

function prefillListing() {
  if (!_lastResult) return;
  const d = _lastResult;
  document.getElementById('li-title').value  = d.title || '';
  document.getElementById('li-cond').value   = document.getElementById('ev-cond').value;
  document.getElementById('li-cat').value    = document.getElementById('ev-cat').value  || '';
  document.getElementById('li-price').value  = d.resale_price_estimate ? d.resale_price_estimate.toFixed(2) : '';
  document.getElementById('li-weight').value = document.getElementById('ev-weight').value;

  // Switch tab
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-listing').classList.add('active');
  document.querySelector('nav button[data-tab="listing"]').classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function doListing() {
  const title = document.getElementById('li-title').value.trim();
  if (!title) { toast('Enter an item title'); return; }

  const body = {
    title,
    condition:              document.getElementById('li-cond').value,
    weight_class:           document.getElementById('li-weight').value,
    category:               document.getElementById('li-cat').value    || undefined,
    estimated_resale_price: parseFloat(document.getElementById('li-price').value) || undefined,
    notes:                  document.getElementById('li-notes').value.trim() || undefined,
  };

  setBusy('li-btn', true);
  try {
    const res  = await fetch('/generate-listing', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    renderListing(data);
  } catch(e) {
    toast('Error: ' + e.message);
  } finally {
    setBusy('li-btn', false);
  }
}

function renderListing(d) {
  const el = document.getElementById('li-output');
  el.style.display = 'block';
  const p = d.suggested_price;

  const pricingHtml = p.list_price ? `
    <div class="price-trio">
      <div class="metric">
        <div class="metric-val pos">$${p.list_price}</div>
        <div class="metric-lbl">List Price</div>
      </div>
      <div class="metric">
        <div class="metric-val" style="color:var(--blue)">$${p.buy_it_now}</div>
        <div class="metric-lbl">Buy It Now</div>
      </div>
      <div class="metric">
        <div class="metric-val" style="color:var(--muted)">$${p.minimum_accept}</div>
        <div class="metric-lbl">Min Accept</div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-bottom:20px;">${esc(p.strategy)}</p>` : '';

  el.innerHTML = `
    <div class="card">
      ${pricingHtml}

      <div class="lsection">
        <div class="lhead">
          <span class="llabel">eBay Title &nbsp;<span style="color:var(--muted);font-weight:400;">${d.title_char_count}/80 chars</span></span>
          <button class="btn btn-ghost btn-sm" onclick="cp(${JSON.stringify(d.ebay_title)}, 'Title')">Copy</button>
        </div>
        <div class="lbox">${esc(d.ebay_title)}</div>
      </div>

      <div class="lsection">
        <div class="lhead"><span class="llabel">Condition (select in eBay dropdown)</span></div>
        <div class="lbox">${esc(d.condition_label)}</div>
      </div>

      <div class="lsection">
        <div class="lhead">
          <span class="llabel">Description</span>
          <button class="btn btn-ghost btn-sm" onclick="cp(${JSON.stringify(d.description)}, 'Description')">Copy</button>
        </div>
        <div class="lbox">${esc(d.description)}</div>
      </div>

      <div class="lsection">
        <div class="lhead">
          <span class="llabel">Search Keywords</span>
          <button class="btn btn-ghost btn-sm" onclick="cp(${JSON.stringify(d.keywords.join(', '))}, 'Keywords')">Copy</button>
        </div>
        <div class="lbox">${esc(d.keywords.join(', '))}</div>
      </div>

      <div class="lsection">
        <div class="lhead"><span class="llabel">Shipping Note</span></div>
        <div class="lbox">${esc(d.shipping_note)}</div>
      </div>

      <p style="font-size:11px;color:var(--muted);margin-top:16px;">⚠ ${esc(d.meta.disclaimer)}</p>
    </div>`;

  el.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ─── Helpers ───────────────────────────────────────────────

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function apiFetch(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  return res.json();
}
</script>
</body>
</html>
